<body id="page-lista">
<header>
    <div class="container nav-container">
        <a href="index.html" class="logo">Dulce</a>
        <nav class="desktop-nav">
            <a href="index.html">Inicio</a>
            <a href="lista-precios.html" class="active">Lista de Precios</a>

<main class="container page-content">
    <section class="section-header">
        <span class="kicker">Catálogo</span>
        <h1>Lista de precios</h1>
        <p>Conocé todos nuestros desayunos y meriendas disponibles.</p>
    </section>

    <section class="tools">
        <input type="text" id="price-search" placeholder="Buscar por nombre o descripción...">
        <span id="price-total">0 productos</span>
    </section>

    <div class="table-wrapper">
        <table id="price-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
